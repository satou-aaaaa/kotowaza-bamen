/* 和紙の帳面：藍の帯に、生成りの和紙。墨の字と朱の印 */

  --night:#1f3a2c; --night2:#15291f; --moon:#f3e9cc;

}
html{height:100%;font-size:18px}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}

h1 small{display:block;font-family:var(--f-body);font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:14px;background:var(--shu);color:#fff;font-weight:700;font-size:1.05rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}

button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.95rem;padding:4px 12px;text-align:center;line-height:1.3}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-family:var(--f-brush);font-weight:900;font-size:1.5rem;text-align:center;margin:0;line-height:1.35}
/* 夜空の帯（ホームの題） */
.sky{position:relative;background:linear-gradient(180deg,var(--night2),var(--night));color:var(--moon);border-radius:16px;padding:22px 16px 18px;text-align:center;overflow:hidden;box-shadow:0 6px 16px #1e234033}
.sky .title{font-family:var(--f-brush);font-weight:900;font-size:2.2rem;letter-spacing:.16em;margin:0;color:var(--moon)}
.sky .lead{margin:6px 0 0;font-size:.92rem;line-height:1.7;color:#e6dcc0}
.sky .lamps{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:1.4rem}
/* 手帳（手がかり） */
.pad{position:relative;background:var(--paper);border:2px solid var(--line);border-left:10px solid var(--ai);border-radius:6px 14px 14px 6px;padding:.9rem .9rem 1rem;box-shadow:0 6px 16px #2a211820}
.pad h2{font-family:var(--f-brush);font-weight:900;font-size:1.05rem;margin:0 0 .5rem;color:var(--ai2);letter-spacing:.06em}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.clue{display:grid;grid-template-columns:2rem 1fr;gap:.5rem;align-items:start;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.55rem .6rem;font-size:1rem;line-height:1.7}
.clue.new{animation:up .35s ease-out}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.clue .no{font-family:var(--f-brush);font-weight:900;color:#fff;background:var(--shu);border-radius:50%;width:1.8rem;height:1.8rem;display:grid;place-items:center;font-size:.95rem;line-height:1}
.clue.wait{background:transparent;border-style:dashed;color:var(--ink2)}
.clue.wait .no{background:transparent;color:var(--ink2);border:1.5px dashed var(--ink2)}
.ask{font-family:var(--f-brush);font-weight:900;text-align:center;margin:0;font-size:1.15rem}
/* 選び肢 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:4.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--paper);border:3px solid var(--ai);box-shadow:0 5px 0 #2d3f6b55;font-family:var(--f-brush);font-weight:900;font-size:1.2rem;color:var(--ink);padding:.6rem .4rem .4rem;text-align:center;line-height:1.3}
.ch small{font-family:var(--f-body);font-weight:500;font-size:.7rem;color:var(--ink2)}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #2d3f6b55}
.ch.ng{opacity:.55;border-color:var(--shu);border-style:dashed;cursor:default;box-shadow:none;animation:shake .4s}
.ch.ng::after{content:"✕ ちがう";position:absolute;top:2px;right:6px;font-family:var(--f-body);font-size:.7rem;font-weight:700;color:var(--shu2)}
.ch.ok{border-color:var(--ok);background:#eef6ef;box-shadow:0 5px 0 #2a6a4466}
.ch.ok::after{content:"✓ 正解";position:absolute;top:2px;right:6px;font-family:var(--f-body);font-size:.7rem;font-weight:700;color:var(--ok2)}
.ch:disabled{cursor:default}

@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

.msg.bad{color:var(--shu2)}

.verdict .hd{display:flex;align-items:center;gap:14px}
.seal{flex:none;width:4.4rem;height:4.4rem;border-radius:50%;border:3px solid var(--shu);display:grid;place-items:center;font-size:2.1rem;background:#fff;transform:rotate(-6deg);animation:stamp .5s ease-out}
.verdict .nm{font-family:var(--f-brush);font-weight:900;font-size:1.45rem;line-height:1.3}
.verdict .nm small{display:block;font-family:var(--f-body);font-size:.75rem;font-weight:500;color:var(--ink2)}
.verdict .why{font-size:1rem;line-height:1.75;margin:0;text-align:left}
.verdict .src{font-size:.8rem;color:var(--ink2);margin:0}
.verdict.lose{border-color:var(--shu)}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.15rem}

.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu);height:12px;margin-top:-2px}.dots i.done{background:var(--ai)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stats b{display:block;font-size:1.3rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;line-height:1.5}

.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-family:var(--f-brush);font-size:1rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}

.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:8px}
.book button,.book .no{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:5.4rem;border-radius:12px;padding:6px;background:var(--paper);border:2px solid var(--line);text-align:center;line-height:1.3}

.tabs{display:flex;gap:6px}.tabs button{flex:1}
.tabs button[aria-pressed="true"]{background:var(--ai);color:#fff;border-color:var(--ai2)}

.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}

.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-family:var(--f-brush);font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}

function startRun(mode, opt) {
  const k = todayKey(); let ng = false;
  save((s) => {
    // あとから：取りこぼした日（過去7日・まだ遊んでいない）だけ。その日の今日の5問と同じ問題。途中経過は日付ごとに runs["a:日付"]
    if (mode === "a") {
      const ra = s.runs[runKey("a", opt)];
      if (!lateDays(s, k).includes(opt)) { ng = true; return; } // 期限は続きからより先に確かめる
      if (ra && ra.date === opt && !doneOf(ra)) return;
      s.runs[runKey("a", opt)] = { mode, date: opt, list: G.dailyTags(opt), res: [], cur: null, id: "a" + opt, a0: achGot(s) };
      return;
    }
    if (mode === "e") { if (s.runs.e) return; s.runs.e = { mode, date: k, list: endlessList(), res: [], cur: null, id: rid(), a0: achGot(s) }; return; }
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない
    const list = mode === "d" || mode === "h" ? listOf(mode, k) : practiceList(s, opt || "");
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: rid(), a0: achGot(s) };
  });
  if (ng) return cal();
  MODE = runKey(mode, opt);
  play();
}

// 今の1問：{ i, date, id, tag, P(問題), wrong:[選んだまちがい], hints(追加で見た手がかり), done }
let cur = null;
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i && r.list[cur.i] === cur.tag; // 保存した進み具合が、この画面と同じ問題か

  const saved = run.cur && run.cur.i === i && run.cur.tag === tag ? run.cur : { wrong: [], hints: 0 };
  cur = { i, date: run.date, id: run.id, tag, P, hard, wrong: (saved.wrong || []).filter((w) => P.opts.includes(w) && w !== P.id), hints: hard ? 0 : Math.min(2, saved.hints || 0), done: false };

        : `<div class="dots" aria-label="${i + 1}問目／${run.list.length}問">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div><span style="font-size:.8rem;color:var(--ink2)">${lab} ${i + 1}/${run.list.length}</span>`}
    </header>

function paint(fresh = -1) {

  document.querySelectorAll(".ch").forEach((b) => { const id = cur.P.opts[+b.dataset.j], ng = cur.wrong.includes(id); b.classList.toggle("ng", ng); b.disabled = ng || cur.done; if (ng) b.setAttribute("aria-label", G.BY[id].n + "（ちがう）"); });

}
function hint() {
  if (cur.done || cur.hard || base() + cur.hints >= 3) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.hints++; keep(); paint(base() + cur.hints - 1);
  $("msg").className = "msg"; $("msg").textContent = `手がかり${NUM[base() + cur.hints - 1]}を見ました。`;

  if (id !== cur.P.id) {
    if (cur.wrong.includes(id)) return;
    buzz(40);
    cur.wrong.push(id); keep(); paint();
    $("msg").className = "msg bad"; $("msg").textContent = `✕ ${G.BY[id].n}ではありません。もう一度どうぞ。`;

  }

}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null; // 別のタブで新しい回が始まっていたら、それは消さない
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]);
    for (const id of newAch) s2.ach[id] = 1;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  result(run.mode, run.date, first, null, newAch);

// とことんの終わり：まちがえずに当てた数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {

    <p class="note" id="ebest">まちがえずに当てたのは ${c}問（まちがい ${miss}回）<br>${best ? "🎉 自己ベスト更新！" : `自己ベスト ${s.ebest}問`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}

// 共有の文：ことわざ（答え）は出さない。まちがい＋手がかりの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");

function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }

    ${mode !== "p" ? `<button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}問）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：むずかしい3問に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">ことわざ帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = practiceMenu; $("go-dex").onclick = () => book();
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// ことわざ帳：当てたことわざが集まる。まだのものは影と「？？？」（名前を出さない）。押すと場面と意味を読み返せる
let bookCat = "h";
function book(cat) {
  if (cat) bookCat = cat;
  const s = load(), list = G.D.filter((x) => x.cat === bookCat);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>ことわざ帳<small>${gotOf(s)}/${G.D.length}</small></h1></header>
    <div class="tabs" role="group" aria-label="分野">${G.CATS.map((c) => `<button class="sub" data-c="${c.id}" aria-pressed="${c.id === bookCat}">${c.name}<br>${gotOf(s, c.id)}/${G.ofCat(c.id).length}</button>`).join("")}</div>
    <p class="note">当てたことわざが書きとめられます。押すと、場面と意味を読み返せます。</p>
    <div class="book">${list.map((x) => s.dex[x.id] > 0 ? `<button data-k="${x.id}"><span class="e" aria-hidden="true">${x.e}</span><b>${esc(x.n)}</b><span class="ct">${s.dex[x.id]}回</span></button>` : `<span class="no" role="img" aria-label="まだ書きとめていない"><span class="e" aria-hidden="true">${x.e}</span><b>？？？</b><span class="ct">${LV[x.lv]}</span></span>`).join("")}</div>
    <button class="sub" id="go-pc">${CATN[bookCat]}で練習する</button>
    ${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => book(b.dataset.c)));
  document.querySelectorAll(".book button").forEach((b) => (b.onclick = () => detail(b.dataset.k)));
  $("go-pc").onclick = () => startRun("p", bookCat);
  bindFooter(); toTop();
}
function detail(id) {
  const s = load(), X = G.BY[id];
  if (!X || !(s.dex[id] > 0)) return book();
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ことわざ帳へ">←</button><h1>${esc(X.n)}<small>${esc(X.r)}・${CATN[X.cat]}・当てた ${s.dex[id]}回</small></h1></header>
    <div class="verdict detail"><div class="hd"><span class="seal" aria-hidden="true">${X.e}</span><span class="nm">${esc(X.n)}<small>${LV[X.lv]}</small></span></div>
    <ol class="clues">${X.c.map((t, j) => `<li class="clue"><span class="no" aria-hidden="true">${NUM[j]}</span><span>${esc(t)}</span></li>`).join("")}</ol>
    <p class="why" data-a11y-say>${esc(X.why)}</p><p class="src">出典：${esc(X.src)}</p></div>
    ${footer()}`;

}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.m) ? rec.m.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--ai)"></em>★★★ ひと目で全部</span><span><em style="background:#d8dcec"></em>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}
